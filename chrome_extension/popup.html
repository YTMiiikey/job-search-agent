<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font-family: sans-serif; width: 280px; padding: 12px; }
    button { width: 100%; padding: 10px; font-size: 14px; cursor: pointer;
             background: #0a66c2; color: white; border: none; border-radius: 4px; }
    button:hover { background: #004182; }
    #status { margin-top: 10px; font-size: 12px; color: #555; min-height: 40px; }
    #status.error { color: #c00; }
    #status.ok { color: #080; }
  </style>
</head>
<body>
  <button id="collect">Collect all job tabs</button>
  <div id="status">Opens all tabs that look like job postings, extracts content, and downloads jobs.json.</div>
  <script src="popup.js"></script>
</body>
</html>
