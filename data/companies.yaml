# Keywords used to filter postings (case-insensitive, matched against
# job title and description).
keywords:
  - protein engineer
  - protein engineering
  - protein design
  - computational biology
  - computational biologist
  - directed evolution
  - machine learning scientist
  - ML scientist
  - protein language model
  - structural biology
  - synthetic biology
  - bioinformatics scientist

# Title-only filter: at least one of these must appear in the job *title*
# (case-insensitive). Prevents broad-keyword matches (e.g. "ML" in the
# description) from pulling in off-target roles like SEM/TEM Engineer or
# Condensed Matter Physicist at companies with diverse research orgs.
title_keywords:
  - protein
  - computational
  - machine learning
  - ml scientist
  - research scientist
  - research engineer
  - directed evolution
  - bioinformatics
  - synthetic biology
  - antibody
  - genomics
  - gene therapy
  - structural biolog
  - foundation model
  - ai scientist
  - ai/ml

# Postings whose location field contains any of these strings (case-insensitive)
# are flagged with status='exclude_location' and skipped. Keeps the job list
# to US-only opportunities.
exclude_locations:
  - London
  - United Kingdom
  - " UK"
  - Amsterdam
  - Netherlands
  - Zurich
  - Switzerland
  - Lausanne
  - Cambridge, UK
  - Toronto
  - Canada

# Postings whose description contains any of these phrases (case-insensitive)
# are flagged with status='exclude_sponsorship' instead of 'new', since they
# indicate the role won't sponsor a visa (relevant for H1B holders).
exclude_keywords:
  - must be a u.s. citizen
  - u.s. citizenship required
  - us citizenship required
  - united states citizen
  - must be a us citizen
  - permanent resident
  - green card holder
  - green card required
  - lawful permanent resident
  - no visa sponsorship
  - not provide visa sponsorship
  - does not sponsor
  - unable to sponsor
  - will not sponsor
  - cannot sponsor
  - sponsorship is not available
  - sponsorship will not be provided
  - not eligible for visa sponsorship
  - is not available for this role now or in the future
  - security clearance
  - active clearance
  - able to obtain a security clearance
  - itar
  - export control regulations
